<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenFront 3D Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      overflow: hidden;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #canvas {
      display: block;
    }

    #controls {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 10px;
      min-width: 250px;
      z-index: 100;
    }

    #controls h1 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #fff;
    }

    .control-group {
      margin-bottom: 15px;
    }

    .control-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      color: #aaa;
    }

    .control-group select,
    .control-group input[type="range"] {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 5px;
      background: #333;
      color: #fff;
    }

    .control-group input[type="range"] {
      padding: 0;
      height: 20px;
    }

    .control-group .value {
      font-size: 11px;
      color: #888;
      margin-top: 3px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }

    .checkbox-group label {
      margin: 0;
      font-size: 14px;
      color: #ddd;
    }

    #stats {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 12px;
      z-index: 100;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 30px 50px;
      border-radius: 10px;
      text-align: center;
      z-index: 200;
    }

    #loading.hidden {
      display: none;
    }

    #loading-text {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #333;
      border-top-color: #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 12px;
      color: #888;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="canvas"></canvas>
  </div>

  <div id="controls">
    <h1>OpenFront 3D Demo</h1>

    <div class="control-group">
      <label>Map</label>
      <select id="map-select">
        <option value="World">World</option>
        <option value="Europe">Europe</option>
        <option value="NorthAmerica">North America</option>
        <option value="Asia">Asia</option>
        <option value="Africa">Africa</option>
      </select>
    </div>

    <div class="control-group">
      <label>Height Scale</label>
      <input type="range" id="height-scale" min="0.1" max="5" step="0.1" value="1.5">
      <div class="value" id="height-scale-value">1.5</div>
    </div>

    <div class="control-group">
      <label>Water Level</label>
      <input type="range" id="water-level" min="-2" max="2" step="0.1" value="0">
      <div class="value" id="water-level-value">0</div>
    </div>

    <div class="control-group checkbox-group">
      <input type="checkbox" id="wireframe">
      <label for="wireframe">Wireframe</label>
    </div>
  </div>

  <div id="stats">
    <div>FPS: <span id="fps">0</span></div>
    <div>Vertices: <span id="vertices">0</span></div>
    <div>Triangles: <span id="triangles">0</span></div>
  </div>

  <div id="loading">
    <div id="loading-text">Loading map...</div>
    <div class="spinner"></div>
  </div>

  <div id="instructions">
    Left click + drag to rotate | Right click + drag to pan | Scroll to zoom
  </div>
</body>
</html>
